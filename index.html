<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Learning Assistant Run Atlas</title>
<meta name="description" content="Every run the learning-assistant app can make, traced from input to output through CopilotKit, AG-UI and A2UI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@500;700&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#141C27; --muted:#5A6678; --faint:#8A95A5; --rule:#D5DCE4; --rule-2:#E4E9EF;
  --accent:#2445C9; --accent-soft:#E3E9FC;
  --lane-ui:#7B3FD0; --lane-ck:#0A7D72; --lane-rt:#B8470F; --lane-wr:#2445C9; --lane-sv:#A8267C; --lane-sub:#5A6B0A;
  --ev-life:#56637A; --ev-text:#334155; --ev-tool:#A76400; --ev-state:#2445C9; --ev-act:#0A7D72; --ev-err:#C0262D;
  --k-http:#B8470F; --k-call:#141C27; --k-ret:#6B7686; --k-a2ui:#7B3FD0; --k-local:#2F7D32; --k-int:#8B5CF6; --k-llm:#A8267C;
  --ok:#2F7D32; --warn:#A76400; --bad:#C0262D;
  --sel:#FFF3C4; --sel-ink:#6B4E00;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Schibsted Grotesk","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1219; --surface:#141B25; --surface-2:#1A2230; --ink:#E4E9F0; --muted:#98A4B6; --faint:#6D7889; --rule:#2A3443; --rule-2:#222B38;
    --accent:#8EA6FF; --accent-soft:#1E2A4F;
    --lane-ui:#B98CFF; --lane-ck:#4FD1C0; --lane-rt:#FF9A5C; --lane-wr:#8EA6FF; --lane-sv:#F27CC6; --lane-sub:#C3D45A;
    --ev-life:#A3AFC2; --ev-text:#C8D1DE; --ev-tool:#F5B347; --ev-state:#8EA6FF; --ev-act:#4FD1C0; --ev-err:#FF7A7F;
    --k-http:#FF9A5C; --k-call:#E4E9F0; --k-ret:#98A4B6; --k-a2ui:#B98CFF; --k-local:#7BD67F; --k-int:#B69CFF; --k-llm:#F27CC6;
    --ok:#7BD67F; --warn:#F5B347; --bad:#FF7A7F;
    --sel:#3A3113; --sel-ink:#F5D77A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1219; --surface:#141B25; --surface-2:#1A2230; --ink:#E4E9F0; --muted:#98A4B6; --faint:#6D7889; --rule:#2A3443; --rule-2:#222B38;
  --accent:#8EA6FF; --accent-soft:#1E2A4F;
  --lane-ui:#B98CFF; --lane-ck:#4FD1C0; --lane-rt:#FF9A5C; --lane-wr:#8EA6FF; --lane-sv:#F27CC6; --lane-sub:#C3D45A;
  --ev-life:#A3AFC2; --ev-text:#C8D1DE; --ev-tool:#F5B347; --ev-state:#8EA6FF; --ev-act:#4FD1C0; --ev-err:#FF7A7F;
  --k-http:#FF9A5C; --k-call:#E4E9F0; --k-ret:#98A4B6; --k-a2ui:#B98CFF; --k-local:#7BD67F; --k-int:#B69CFF; --k-llm:#F27CC6;
  --ok:#7BD67F; --warn:#F5B347; --bad:#FF7A7F;
  --sel:#3A3113; --sel-ink:#F5D77A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:12px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{border-right:1px solid var(--rule);background:var(--surface);padding:20px 14px 40px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.15;margin:0 6px 4px;text-wrap:balance}
.brand-sub{color:var(--muted);font-size:12.5px;margin:0 6px 16px}
.filter{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:13px;margin-bottom:12px}
:is(.filter,.case-btn,.wire-row,.tab,.fnode,.fbtn,.dbtn):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grp{margin-top:14px}
.grp-h{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 8px 4px}
.case-btn{display:grid;grid-template-columns:30px 1fr;gap:4px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink)}
.case-btn:hover{background:var(--surface-2)}
.case-btn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.case-btn .cid{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.case-btn[aria-current="true"] .cid{color:var(--accent)}
.mobile-pick{display:none}
/* main */
main{padding:24px clamp(16px,3vw,36px) 64px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3vw,32px);letter-spacing:-.02em;line-height:1.1;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0 0 10px}
h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:18px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.box p{margin:0;max-width:68ch}
.box ul{margin:0;padding-left:18px}
.box li{margin:2px 0}
.trigger{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px dashed var(--rule);border-radius:6px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:4px 0 18px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px 9px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab svg{width:14px;height:14px}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 10px}
.sec-h h2{margin:0;font-size:20px}
.sec-h span{font-size:12.5px;color:var(--muted)}
/* overview */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 14px}
.stat b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.ov-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px}
.qsteps{list-style:none;margin:0;padding:0;counter-reset:q}
.qsteps li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--rule-2)}
.qsteps li:first-child{border-top:0}
.qsteps li::before{counter-increment:q;content:counter(q);width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;display:grid;place-items:center;margin-top:1px}
.qsteps b{font-weight:600}
.qsteps small{display:block;color:var(--muted);font-size:12.5px}
.chain{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7}
.chain span{color:var(--ink)}
/* wire list */
.wire{font-family:var(--mono);font-size:11.8px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.wire-h{padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.wire-h h2{margin:0}
.wire-h span{font-family:var(--sans);font-size:12px;color:var(--muted)}
.wire-list{max-height:380px;overflow:auto}
.wire-row{display:grid;grid-template-columns:34px 170px minmax(0,1fr) 78px;gap:8px;padding:5px 14px;border-top:1px solid var(--rule-2);cursor:pointer;align-items:baseline;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit}
.wire-row:first-child{border-top:0}
.wire-row:hover{background:var(--surface-2)}
.wire-row[aria-selected="true"]{background:var(--sel);color:var(--sel-ink)}
.wire-row .n{color:var(--faint);font-variant-numeric:tabular-nums}
.wire-row .t{font-weight:600}
.wire-row .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.wire-row[aria-selected="true"] .d{color:inherit}
.wire-row .o{font-size:10.5px;text-align:right;white-space:nowrap}
.state-list{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:11.8px}
.state-list li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;padding:5px 0;border-top:1px solid var(--rule-2)}
.state-list li:first-child{border-top:0}
.state-list .k{color:var(--lane-sv);font-weight:600}
.notes{margin-top:14px}
.notes li{margin:4px 0;max-width:90ch}
/* flow visualization */
.flow-card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.flow-card-h{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--muted);flex-wrap:wrap}
.flow-card-h b{color:var(--ok);font-weight:500;font-size:12px}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 340px}
.flow-canvas{position:relative;overflow:auto;max-height:78vh;min-height:420px;background-color:var(--surface-2);background-image:radial-gradient(var(--rule) 1px,transparent 1.2px);background-size:18px 18px}
.flow-inner{position:relative;margin:0 auto}
.flow-inner svg{position:absolute;inset:0;overflow:visible}
.edge{fill:none;stroke:var(--faint);stroke-width:1.6;opacity:.55}
.edge.pending{stroke:var(--rule);stroke-dasharray:4 5;opacity:1}
.edge.done{stroke:var(--ok);opacity:.75}
.edge.active{stroke:var(--accent);stroke-width:2.2;opacity:1;stroke-dasharray:7 6;animation:dash .8s linear infinite}
.edge.side{stroke-dasharray:3 4}
@keyframes dash{to{stroke-dashoffset:-26}}
.elabel{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface);border:1px solid var(--rule);color:var(--muted);white-space:nowrap;pointer-events:none}
.elabel.active{border-color:var(--accent);color:var(--accent)}
.fnode{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;padding:7px 10px 8px 12px;border-radius:8px;border:1.5px solid var(--lc);background:color-mix(in srgb,var(--lc) 13%,var(--surface));cursor:pointer;transition:opacity .25s,box-shadow .25s,background .25s,border-color .25s;overflow:hidden}
.fnode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lc)}
.fnode .ft{font-weight:600;font-size:12.5px;line-height:1.25;color:var(--ink);display:flex;gap:6px;align-items:center}
.fnode .fl{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--lc);text-transform:uppercase}
.fnode .fs{font-family:var(--mono);font-size:10.5px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fnode.pending{--lc:var(--faint);background:var(--surface);opacity:.55;border-style:dashed}
.fnode.done{background:color-mix(in srgb,var(--lc) 8%,var(--surface))}
.fnode.done .ft::after{content:"✓";color:var(--ok);font-size:12px}
.fnode.active{box-shadow:0 0 0 4px color-mix(in srgb,var(--lc) 28%,transparent),0 6px 18px color-mix(in srgb,var(--lc) 25%,transparent);background:color-mix(in srgb,var(--lc) 20%,var(--surface));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--lc) 16%,transparent),0 6px 18px color-mix(in srgb,var(--lc) 25%,transparent)}}
.fctl{position:sticky;top:12px;left:12px;z-index:3;width:230px;margin:12px 0 -96px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.fctl-row{display:flex;gap:6px}
.fbtn{width:32px;height:30px;border-radius:6px;border:1px solid var(--rule);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;padding:0}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.fbtn svg{width:14px;height:14px}
.fctl-l{font-size:12px;color:var(--muted);margin:8px 0 5px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--rule-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.fdetail{border-left:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;max-height:78vh;min-height:420px}
.fdetail-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--rule-2)}
.fdetail-h h3{margin:0;font-family:var(--display);font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink)}
.fdetail-b{padding:12px 16px 18px;overflow:auto}
.fdetail-b h4{margin:0 0 4px;font-size:15px;color:var(--accent);font-weight:600}
.fdetail-b p{margin:0 0 12px;color:var(--muted);font-size:13px}
.fdetail-b .lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.comp{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:3px 0}
.comp i{width:8px;height:8px;border-radius:2px;flex:none;transform:translateY(1px)}
.comp span{color:var(--muted);font-family:var(--mono);font-size:11px}
details.it{border:1px solid var(--rule-2);border-radius:6px;margin:0 0 6px;background:var(--surface)}
details.it[open]{border-color:var(--rule)}
details.it summary{list-style:none;cursor:pointer;padding:6px 8px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;font-family:var(--mono);font-size:11.5px}
details.it summary::-webkit-details-marker{display:none}
details.it summary .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.it .body{padding:0 8px 8px}
details.it .body p{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.kind{font-family:var(--mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:4px;color:var(--surface);white-space:nowrap}
.ref{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 8px;word-break:break-all}
pre.json{margin:0;background:var(--surface-2);border:1px solid var(--rule-2);border-radius:6px;padding:9px 10px;font-family:var(--mono);font-size:11px;line-height:1.5;overflow:auto;white-space:pre;max-height:300px}
.j-k{color:var(--lane-sv)} .j-s{color:var(--lane-ck)} .j-n{color:var(--lane-rt)} .j-b{color:var(--accent)}
.lane-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--rule)}
.lane-key span{display:inline-flex;align-items:center;gap:6px}
.lane-key i{width:10px;height:10px;border-radius:3px}
/* interactive demo */
.demo{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.demo-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule)}
.demo-bar h3{margin:0 8px 0 0;font-family:var(--display);font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink)}
.dbtn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--rule);background:var(--surface-2);border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer}
.dbtn.go{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:color-mix(in srgb,var(--ok) 45%,var(--rule));color:var(--ok);font-weight:600}
.dbtn:hover{border-color:var(--accent)}
.dbtn:disabled{opacity:.5;cursor:default}
.speed{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.speed input{width:90px;accent-color:var(--accent)}
.lanes-strip{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.lanes-strip span{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;border:1px solid var(--rule);color:var(--faint);transition:all .2s}
.lanes-strip span.on{color:var(--surface);background:var(--lc);border-color:var(--lc)}
.now{padding:9px 14px;border-bottom:1px solid var(--rule-2);font-size:12.5px;color:var(--muted);background:var(--surface-2);min-height:38px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.now b{color:var(--ink);font-weight:600}
.now code{color:var(--ink)}
.demo-grid{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);min-height:440px}
.d-chat{border-right:1px solid var(--rule);display:flex;flex-direction:column;min-width:0}
.pane-h{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 12px 6px;display:flex;justify-content:space-between}
.d-msgs{flex:1;overflow:auto;padding:4px 12px 14px;display:flex;flex-direction:column;gap:8px;max-height:520px}
.bub{max-width:88%;padding:7px 10px;border-radius:10px;font-size:12.8px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bub.user{align-self:flex-end;background:var(--accent);color:var(--surface);border-bottom-right-radius:3px}
.bub.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--rule-2);border-bottom-left-radius:3px}
.bub.bot.streaming::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
.bub.err{border-color:color-mix(in srgb,var(--bad) 40%,var(--rule));background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
@keyframes blink{50%{opacity:0}}
.typing{align-self:flex-start;display:flex;gap:4px;padding:8px 10px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-4px);opacity:.5}}
.tcard{align-self:stretch;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:12.5px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.tcard .row{display:flex;gap:8px;align-items:center}
.tcard .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.tcard.running .dot{animation:bounce 1s infinite}
.tcard.done .dot{background:var(--ok)} .tcard.failed .dot{background:var(--bad)} .tcard.stopped .dot{background:var(--faint)}
.tcard .tt{font-weight:600}

/* ────────────────────────── Helpers ────────────────────────── */
const OVERVIEW = {id:"overview",group:"Start here",code:"00",title:"How a turn flows"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const colorOf = s => s.k==="ev" ? `var(${EVC(s.ev)})` : `var(${(KINDS[s.k]||KINDS.act).c})`;
const laneVar = id => `var(${LANES[LI[id]].c})`;
const kindName = s => s.k==="ev" ? "event" : (KINDS[s.k]||KINDS.act).name;
function hlJSON(obj){
  const txt = typeof obj==="string" ? obj : JSON.stringify(obj,null,2);
  return esc(txt).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?\b)/g,(m,str,colon,bool,num)=>{
    if(str) return colon?`<span class="j-k">${str}</span>${colon}`:`<span class="j-s">${str}</span>`;
    if(bool) return `<span class="j-b">${bool}</span>`;
    if(num) return `<span class="j-n">${num}</span>`;

/* Phases: the flow visualization's steps, built from the markers in a case's steps. */
function phasesOf(c){
  if(c._phases) return c._phases;
  const out = [];
  c.steps.forEach((s,i)=>{
    if(s.k==="ph"){ out.push({t:s.t,d:s.d,nodes:s.nodes,e:s.e,par:s.par,items:[]}); return; }

  });
  return c._phases = out;
}
const flatSteps = c => c.steps.filter(s=>s.k!=="ph");

    } else {
      const cx = (FW-NW)/2, offs = [0, NW+SIDE_GAP+18, -(NW+SIDE_GAP+18)];

}

function flowToggle(){

const DELAY = {ph:350, act:750, llm:950, http:700, call:650, ret:650, local:700, int:650, a2ui:500, ev:520};

/* JSON Pointer add/replace/remove on the simulated agent.state */
function applyOps(S, ops){
  (ops||[]).forEach(o=>{
    const parts = o.path.split("/").slice(1).map(p=>p.replace(/~1/g,"/").replace(/~0/g,"~"));
    let t = S;
    for(let k=0;k<parts.length-1;k++){ const p = parts[k]; if(t[p]==null || typeof t[p]!=="object") t[p] = {}; t = t[p]; }
    const last = parts[parts.length-1];
    if(o.op==="remove"){ Array.isArray(t) ? t.splice(+last,1) : delete t[last]; }
    else t[last] = o.value===undefined ? "✓ written" : clone(o.value);
    demo.changed.add(parts[0]);
    if(parts[0]==="board"||parts[0]==="boardDraft") demo.tabHint = "board";
    else if(["stage","status","draft","research","material","quiz","evaluation","score","feedback"].includes(parts[0])) demo.tabHint = "path";
  });
}

function cardLabels(c){

function applyDemoStep(s){

  if(s.say) demo.chat.push({type:"user", text:s.say});
  if(s.ops) applyOps(demo.S, s.ops);
  if(s.hitl){ const h = [...demo.chat].reverse().find(m=>m.type==="card" && m.tool==="confirmNewTopic"); if(h){ h.picked = s.hitl; h.status="done"; } }
  if(s.k==="act" && s.f==="ui" && !/^Student sends/.test(s.l)) demoToast(s.l);
  if(s.k==="http" || (s.k==="call" && s.f==="ck" && s.t==="rt")) demo.wire.push({cls:"l-http", text:`→ ${s.l}`});
  if(s.store){ Object.assign(demo.store, s.store); Object.keys(s.store).forEach(k=>demo.changed.add(k)); }

        if(c.tool==="deleteBoardSurface") c.title = [...txt.matchAll(/"title":"([^"]+)"/g)].map(m=>m[1]).join(", ");

  }
}

function briefJSON(v, depth=0){
  if(v===null) return "null";

  if(Array.isArray(v)) return v.length===0 ? "[]" : depth>=1 ? `[…${v.length}]` : `[${v.slice(0,2).map(x=>briefJSON(x,depth+1)).join(", ")}${v.length>2?`, …+${v.length-2}`:""}]`;
  const ks = Object.keys(v); if(!ks.length) return "{}";
  if(depth>=1) return `{ ${ks.slice(0,4).join(", ")}${ks.length>4?", …":""} }`;
  return `{ ${ks.slice(0,6).map(k=>`${k}: ${briefJSON(v[k],depth+1)}`).join(", ")}${ks.length>6?", …":""} }`;
}

        <li class="rt"><div><code>A2UIMiddleware.processStream</code><small>Runtime: a tool result with <code>a2ui_operations</code> → ACTIVITY_SNAPSHOT; holds RUN_FINISHED to the end. Also turns forwardedProps.a2uiAction into a log_a2ui_event message on the way in.</small></div></li>
      </ol></div>
      <div class="box"><h2>How the client uses each event</h2><div class="tbl-wrap"><table class="t">
        <tr><th>Event</th><th>Who makes it</th><th>What the client does</th></tr>
        <tr><td><code>RUN_STARTED / FINISHED</code></td><td>Supervisor, or wrapper on Submit</td><td>isRunning locks canvas input; after FINISHED, pending frontend tools run and may start a follow-up run</td></tr>
        <tr><td><code>TEXT_MESSAGE_*</code></td><td>Supervisor, or wrapper for errors</td><td>Assistant bubble in CopilotChat</td></tr>
        <tr><td><code>TOOL_CALL_*</code></td><td>Supervisor, or wrapper (synthetic evaluate, lost results)</td><td>Card by tool name: useRenderTool, useComponent, useFrontendTool, useHumanInTheLoop</td></tr>
        <tr><td><code>STATE_DELTA</code></td><td>Wrapper only</td><td>JSON Patch on agent.state → useLearningAgent → stages, stepper, Board</td></tr>
        <tr><td><code>ACTIVITY_SNAPSHOT</code></td><td>A2UIMiddleware only</td><td>CopilotChat draws a2ui-surface with CHAT_UI_CATALOG</td></tr>
        <tr><td><code>RUN_ERROR</code></td><td>Supervisor or wrapper</td><td>Run marked failed; the explanation text came first</td></tr>
      </table></div></div>
      <div class="box"><h2>Four A2UI catalogs</h2><div class="tbl-wrap"><table class="t">
        <tr><th>Catalog</th><th>Who writes the tree</th><th>Where it draws</th></tr>
        <tr><td><code>canvas/v1</code></td><td>Fixed JSON templates (research, quiz, evaluation, score); state fills the data model</td><td>Learning path stages</td></tr>
        <tr><td><code>feedback/v1</code></td><td>Evaluator LLM via render_a2ui (FeedbackCard, ConceptChip, ReviewLink, NextStepList)</td><td>Feedback stage</td></tr>
        <tr><td><code>chat/v1</code></td><td>Supervisor, renderSurface target chat</td><td>Inline in the chat (activity)</td></tr>
        <tr><td><code>board/v1</code></td><td>Supervisor, renderSurface target canvas / updateBoardSurface</td><td>Board tab (state.board)</td></tr>
      </table></div></div>
      <div class="box"><h2>Three ways the canvas changes</h2><ul>
        <li><b>Server tool result</b> → wrapper STATE_DELTA (B2–B6, B8, D1–D3).</li>
        <li><b>Client write</b> with agent.setState, no run (B7, B12, reflection, confirm new topic). The server sees it in the next run's state.</li>
        <li><b>Streaming drafts</b> → <code>/draft</code> and <code>/boardDraft</code> deltas while a tool runs, cleared when it ends.</li>
      </ul></div>
    </div>`;
}

function show(id, push=true){
  const c = id==="overview" ? OVERVIEW : CASES.find(x=>x.id===id);
  if(!c || c===OVERVIEW) renderOverview(); else renderCase(c);
  buildNav($("#filter").value);
  if(push){ try{ history.replaceState(null,"","#"+(c?c.id:"overview")); }catch(e){} }
  window.scrollTo(0,0);
}
document.addEventListener("click", e=>{
  const b = e.target.closest(".case-btn"); if(b){ show(b.dataset.id); return; }
  const a = e.target.closest('a[href^="#"]'); if(a){ e.preventDefault(); show(a.getAttribute("href").slice(1)); }
});
$("#pick").addEventListener("change", e=>show(e.target.value));
$("#filter").addEventListener("input", e=>buildNav(e.target.value));
document.addEventListener("keydown", e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(tab==="flow" && flow.c){
    const n = phasesOf(flow.c).length;
    if(e.key==="ArrowRight"){ flowStop(); flowGo(Math.min(n-1,flow.i+1)); e.preventDefault(); }
    if(e.key==="ArrowLeft"){ flowStop(); flowGo(Math.max(0,flow.i-1)); e.preventDefault(); }
    if(e.key===" "){ flowToggle(); e.preventDefault(); }
  }
});
show((location.hash||"").slice(1) || "overview", false);
</script>
